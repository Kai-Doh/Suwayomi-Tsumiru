# Kai's fork only (never part of an upstream PR): a Linux AppImage of this branch, as a workflow
# artifact. Same steps as release-fork.yml's Linux job, without the release/zsync repack (an
# update from upstream's releases would drop the fork's changes).
name: Kai Linux AppImage

on:
  workflow_dispatch:
  push:
    branches: [kai-build]

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Install Linux build deps
        run: |
          opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25"
          sudo apt-get $opts update
          sudo apt-get $opts install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libx11-dev libblkid-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev libavif-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test test/src/routes/reader_link_test.dart
      - name: Build Linux AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TSUMIRU_BUNDLE_AVIF_DEPS: "1"
        run: |
          sudo wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /usr/local/bin/appimagetool" | sha256sum -c -
          sudo chmod +x /usr/local/bin/appimagetool
          sudo apt-get install -y --no-install-recommends plocate && sudo updatedb || true
          dart pub global activate fastforge
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fastforge package --platform linux --targets appimage
          mkdir -p out
          mv "$(find dist -name '*.AppImage' | head -1)" "out/tsumiru-kai-${GITHUB_SHA::7}-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: tsumiru-kai-linux-appimage
          path: out/*.AppImage
          retention-days: 30
